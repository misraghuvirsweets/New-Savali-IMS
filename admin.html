<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raghuvir IMS - Admin Dashboard</title>
<style>
  :root{
    --maroon:#6d2932; --maroon-dark:#4e1e25; --gold:#c98a2c; --bg:#faf6f1;
    --ok:#2f8f4e; --warn:#c0392b; --card:#ffffff; --line:#e7ddd2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#2a2a2a;overflow-x:hidden;}
  header{background:var(--maroon);color:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;}
  header p{margin:2px 0 0;font-size:11px;opacity:.85;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  label{font-size:12px;font-weight:600;color:#6b5c50;display:block;margin-bottom:5px;}
  input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:10px;background:#fff;}
  input[type=number]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:10px;background:#fff;}
  select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:10px;background:#fff;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:10px;display:none;}
  .msg.ok{background:#e7f6ea;color:var(--ok);display:block;}
  .msg.err{background:#fdecea;color:var(--warn);display:block;}
  input:focus{outline:none;border-color:var(--gold);}
  button{padding:10px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-secondary{background:#efe6db;color:var(--maroon-dark);}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0;max-width:1100px;margin:0 auto;}
  .tab{padding:9px 14px;font-size:13px;border-radius:8px 8px 0 0;color:var(--maroon-dark);cursor:pointer;background:#efe1d3;border:1px solid var(--line);border-bottom:none;}
  .tab.active{background:var(--card);font-weight:700;color:var(--maroon);}

  .toolbar{max-width:1100px;margin:0 auto;padding:0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .toolbar input{flex:1;min-width:180px;margin-bottom:0;}
  .count-badge{font-size:12px;color:#777;white-space:nowrap;}

  .table-wrap{max-width:1100px;margin:10px auto 24px;padding:0 14px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:#f1e6d8;color:var(--maroon-dark);font-weight:700;position:sticky;top:0;}
  tr:hover td{background:#fbf6ee;}
  .lowstock{color:var(--warn);font-weight:700;}
  .empty-msg{padding:20px;text-align:center;color:#999;font-size:13px;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;max-width:1100px;margin:10px auto;padding:0 14px;}
  .stat{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .stat .num{font-size:22px;font-weight:700;color:var(--maroon);}
  .stat .lbl{font-size:11px;color:#777;margin-top:2px;}
  .section-title{font-size:13px;font-weight:700;color:var(--maroon-dark);margin:16px auto 8px;max-width:1100px;padding:0 14px;}
  .location-table-wrap{max-width:1100px;margin:0 auto 10px;padding:0 14px;overflow-x:auto;}
</style>
</head>
<body>

<header>
  <h1>🍬 RAGHUVIR SWEETS &amp; BAKERS</h1>
  <p>Admin Dashboard — All Records</p>
</header>

<div class="msg" id="testMsg" style="margin:14px;"></div>

<div class="card" id="urlSetupCard" style="display:none;margin:14px;">
  <label>⚠️ Web App URL not set - paste it here to continue</label>
  <input type="text" id="urlSetupInput" placeholder="https://script.google.com/macros/s/XXXXX/exec">
  <button class="btn-primary" onclick="saveUrlFallback()">💾 Save &amp; Continue</button>
  <p style="font-size:11px;color:#888;margin-top:8px;">
    This is saved only in this browser/device. To make it permanent for everyone, edit the
    API_URL line near the top of this file's code instead.
  </p>
</div>

<div class="tabs" id="tabBar"></div>

<div class="toolbar" id="toolbarView">
  <input type="text" id="searchBox" placeholder="🔍 Search this table…" oninput="applyFilter()">
  <select id="extraFilterSelect" style="display:none;flex:0 0 auto;min-width:160px;" onchange="applyFilter()"><option value="">All</option></select>
  <button class="btn-secondary" onclick="loadCurrentTable()">🔄 Refresh</button>
  <span class="count-badge" id="countBadge"></span>
</div>

<div class="table-wrap" id="tableView">
  <table id="dataTable">
    <thead><tr><th>Loading…</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div id="dashboardView" style="display:none;">
  <div class="stats" id="locationStatsRow"></div>
  <div id="locationDetailWrap"></div>
</div>

<div class="card" id="addItemView" style="display:none;max-width:1100px;margin:10px auto 24px;">
  <label>Item Name</label>
  <input type="text" id="addName" placeholder="e.g. Kaju Katli Box - 500g">
  <label>Category</label>
  <input type="text" id="addCategory" placeholder="e.g. Packing Box, Ribbon, Sticker">

  <label>Storage Type</label>
  <select id="addStorageType">
    <option value="racked">Racked (stored on a rack)</option>
    <option value="nonracked">Non-Racked (loose storage zone)</option>
  </select>

  <label id="addLocationLabel">Rack Code</label>
  <select id="addLocation"><option value="">Loading…</option></select>

  <label>Unit</label>
  <input type="text" id="addUnit" placeholder="e.g. Pcs, Box, Roll" value="Pcs">
  <label>Reorder Level</label>
  <input type="number" id="addReorder" placeholder="e.g. 50" value="0">

  <label>Barcode</label>
  <select id="addBarcodeMode">
    <option value="generate">Generate a new QR sticker (we print &amp; stick it)</option>
    <option value="existing">Use existing vendor barcode (already on the box)</option>
  </select>

  <div id="addExistingBarcodeBlock" style="display:none;">
    <label>Existing barcode value</label>
    <input type="text" id="addExistingBarcode" placeholder="Type or scan the existing barcode">
  </div>

  <div class="msg" id="addMsg"></div>
  <button class="btn-primary" id="addSubmitBtn" onclick="submitAddItem()" style="width:100%;">✅ Create Item</button>
</div>

<div class="card" id="manageBranchesView" style="display:none;max-width:1100px;margin:10px auto 24px;">
  <label>Add New Branch</label>
  <div style="display:flex;gap:10px;">
    <input type="text" id="newBranchName" placeholder="e.g. New Outlet Name" style="flex:1;">
    <button class="btn-primary" onclick="addBranchFromAdmin()" style="flex:0 0 auto;">➕ Add Branch</button>
  </div>
  <div class="msg" id="branchMsg"></div>

  <label style="margin-top:10px;">Existing Branches</label>
  <table id="branchListTable"><tbody><tr><td>Loading…</td></tr></tbody></table>
</div>

<script>
const TABLES = [
  { key: 'Item_Master',   label: '📦 Item Master' },
  { key: 'Stock_Ledger',  label: '📊 Stock Ledger' },
  { key: 'Inward_Entry',  label: '📥 Inward Log' },
  { key: 'Outward_Entry', label: '📤 Outward Log' },
  { key: 'Branch_Ledger', label: '🏬 Branch Ledger' },
  { key: 'Branches',      label: '🏬 Branches' },
  { key: 'Racks',         label: '🗄️ Racks' }
];
const ADD_ITEM_KEY = 'AddItem'; // special tab - shows a form instead of a table
const MANAGE_BRANCHES_KEY = 'ManageBranches'; // special tab - add/delete branches
const DASHBOARD_KEY = 'Dashboard'; // special tab - godown vs branch-wise stock overview

// ============================= PASTE YOUR WEB APP URL BELOW ======================================
// After deploying WebApp.gs in Apps Script (Deploy > New deployment > Web app), copy the URL
// it gives you and paste it between the quotes here. This is the recommended permanent setup -
// everyone who opens this hosted file gets it automatically, nothing to type on each device.
const API_URL = "https://script.google.com/macros/s/AKfycbzRyb3a1UBD2HfiA3_OYPEVghv3Bu4yMkPMfqncCv6ScWFsVh77lxwp7Z2_WQiVaGT_/exec";
// Example: const API_URL = "https://script.google.com/macros/s/AKfycb.../exec";

// If the line above was never edited, fall back to a URL saved earlier in this browser (via the
// on-page box that appears below), so the app still works instead of just showing an error.
const URL_PLACEHOLDER = 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE';
function getEffectiveApiUrl() {
  if (API_URL.indexOf(URL_PLACEHOLDER) === -1 && API_URL.trim() !== '') return API_URL.trim();
  return (localStorage.getItem('ims_api_url_fallback') || '').trim();
}

function saveUrlFallback() {
  const url = document.getElementById('urlSetupInput').value.trim();
  if (!url) { alert('Please paste your Web App URL.'); return; }
  localStorage.setItem('ims_api_url_fallback', url);
  document.getElementById('urlSetupCard').style.display = 'none';
  document.getElementById('testMsg').style.display = 'none';
  loadCurrentTable();
}

let currentTableKey = DASHBOARD_KEY;
let currentHeaders = [];
let currentRows = [];

function callApi(action, data) {
  const url = getEffectiveApiUrl();
  if (!url) {
    document.getElementById('urlSetupCard').style.display = 'block';
    return Promise.reject(new Error('Web App URL not set yet - paste it in the box above, or edit the API_URL constant in the code.'));
  }
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, data || {}))
  }).then(r => r.text()).then(text => {
    let res;
    try {
      res = JSON.parse(text);
    } catch (e) {
      throw new Error('Server did not return valid data - check the Web App URL and that it has been redeployed (Deploy > Manage deployments > New version).');
    }
    if (res && res.error) throw new Error(res.error);
    return res;
  });
}

function buildTabs() {
  const bar = document.getElementById('tabBar');
  const allTabs = [{ key: DASHBOARD_KEY, label: '📊 Dashboard' }]
    .concat(TABLES)
    .concat([
      { key: ADD_ITEM_KEY, label: '➕ Add Item' },
      { key: MANAGE_BRANCHES_KEY, label: '🏬 Manage Branches' }
    ]);
  bar.innerHTML = allTabs.map(t =>
    '<div class="tab' + (t.key === currentTableKey ? ' active' : '') + '" data-key="' + t.key + '">' + t.label + '</div>'
  ).join('');
  bar.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentTableKey = tab.dataset.key;
      document.getElementById('searchBox').value = '';
      buildTabs();
      if (currentTableKey === DASHBOARD_KEY) {
        showDashboardView();
      } else if (currentTableKey === ADD_ITEM_KEY) {
        showAddItemView();
      } else if (currentTableKey === MANAGE_BRANCHES_KEY) {
        showManageBranchesView();
      } else {
        showTableView();
        loadCurrentTable();
      }
    });
  });
}

function hideAllViews() {
  document.getElementById('toolbarView').style.display = 'none';
  document.getElementById('tableView').style.display = 'none';
  document.getElementById('addItemView').style.display = 'none';
  document.getElementById('manageBranchesView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'none';
}

function showTableView() {
  hideAllViews();
  document.getElementById('toolbarView').style.display = 'flex';
  document.getElementById('tableView').style.display = 'block';
}

function showAddItemView() {
  hideAllViews();
  document.getElementById('addItemView').style.display = 'block';
  loadRacksForAddItem();
}

function showManageBranchesView() {
  hideAllViews();
  document.getElementById('manageBranchesView').style.display = 'block';
  loadBranchListForManage();
}

function showDashboardView() {
  hideAllViews();
  document.getElementById('dashboardView').style.display = 'block';
  loadLocationStock();
}

// Which column (by header name, case-insensitive) the extra filter dropdown should group by,
// per table - only these two tables get the dropdown; others just get the search box.
const EXTRA_FILTER_CONFIG = {
  'Stock_Ledger': { headerMatch: 'location', label: 'Filter by Rack/Location' },
  'Branch_Ledger': { headerMatch: 'branch', label: 'Filter by Branch' }
};

function loadCurrentTable() {
  document.getElementById('dataTable').innerHTML = '<thead><tr><th>Loading…</th></tr></thead><tbody></tbody>';
  document.getElementById('countBadge').textContent = '';
  callApi('getSheetData', { sheetName: currentTableKey }).then(res => {
    currentHeaders = res.headers || [];
    currentRows = res.rows || [];
    setupExtraFilter();
    renderTable(currentRows);
  }).catch(err => {
    document.getElementById('dataTable').innerHTML =
      '<thead><tr><th>Error</th></tr></thead><tbody><tr><td>' + err.message + '</td></tr></tbody>';
  });
}

function setupExtraFilter() {
  const wrap = document.getElementById('extraFilterSelect');
  const config = EXTRA_FILTER_CONFIG[currentTableKey];
  if (!config) {
    wrap.style.display = 'none';
    wrap.innerHTML = '<option value="">All</option>';
    return;
  }
  const colIdx = currentHeaders.findIndex(h => String(h).toLowerCase().indexOf(config.headerMatch) !== -1);
  if (colIdx === -1) { wrap.style.display = 'none'; return; }

  const values = Array.from(new Set(currentRows.map(r => r[colIdx]).filter(v => v))).sort();
  wrap.innerHTML = '<option value="">' + config.label + ' (All)</option>' +
    values.map(v => '<option value="' + v + '">' + v + '</option>').join('');
  wrap.dataset.colIdx = colIdx;
  wrap.style.display = 'block';
}

function renderTable(rows) {
  const isItemMaster = currentTableKey === 'Item_Master';
  const skuIdx = isItemMaster ? currentHeaders.findIndex(h => String(h).toLowerCase().indexOf('sku') !== -1) : -1;

  const thead = '<thead><tr>' + currentHeaders.map(h => '<th>' + h + '</th>').join('') +
    (isItemMaster ? '<th>Action</th>' : '') + '</tr></thead>';

  let tbody;
  if (!rows.length) {
    tbody = '<tbody><tr><td colspan="' + Math.max(currentHeaders.length + (isItemMaster ? 1 : 0), 1) + '" class="empty-msg">No records yet.</td></tr></tbody>';
  } else {
    tbody = '<tbody>' + rows.map(r => {
      const cells = r.map((c, i) => {
        const isStatusCol = currentHeaders[i] === 'Status' && String(c).indexOf('LOW') !== -1;
        return '<td' + (isStatusCol ? ' class="lowstock"' : '') + '>' + (c === null || c === undefined ? '' : c) + '</td>';
      }).join('');
      const actionCell = isItemMaster && skuIdx !== -1
        ? '<td><button class="queue-row-del" style="background:none;border:none;color:var(--warn);font-weight:700;cursor:pointer;" onclick="deleteItemRow(\'' + String(r[skuIdx]).replace(/'/g, "\\'") + '\')">🗑️ Delete</button></td>'
        : '';
      return '<tr>' + cells + actionCell + '</tr>';
    }).join('') + '</tbody>';
  }
  document.getElementById('dataTable').innerHTML = thead + tbody;
  document.getElementById('countBadge').textContent = rows.length + ' row' + (rows.length === 1 ? '' : 's');
}

function applyFilter() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const filterSel = document.getElementById('extraFilterSelect');
  const filterVal = filterSel.style.display !== 'none' ? filterSel.value : '';
  const colIdx = filterSel.dataset.colIdx !== undefined ? Number(filterSel.dataset.colIdx) : -1;

  let filtered = currentRows;
  if (filterVal && colIdx !== -1) {
    filtered = filtered.filter(r => String(r[colIdx]) === filterVal);
  }
  if (q) {
    filtered = filtered.filter(r => r.some(c => String(c || '').toLowerCase().indexOf(q) !== -1));
  }

  renderTable(filtered);
  document.getElementById('countBadge').textContent = filtered.length + ' of ' + currentRows.length + ' rows';
}

function deleteItemRow(sku) {
  if (!confirm('Delete item "' + sku + '" permanently? This cannot be undone.')) return;
  callApi('deleteItem', { sku: sku }).then(res => {
    if (res.success) {
      loadCurrentTable();
    } else {
      alert('❌ ' + res.message);
    }
  }).catch(err => alert('❌ ' + err.message));
}

window.onload = function() {
  buildTabs();
  document.getElementById('addStorageType').addEventListener('change', refreshLocationOptions);
  document.getElementById('addBarcodeMode').addEventListener('change', toggleBarcodeModeUI);

  if (!getEffectiveApiUrl()) {
    document.getElementById('urlSetupCard').style.display = 'block';
  } else {
    showDashboardView();
  }
};

// ---------------- ADD ITEM FORM ----------------
let allRacks = [];

function loadRacksForAddItem() {
  callApi('getRacks').then(list => {
    allRacks = list;
    refreshLocationOptions();
  }).catch(err => {
    document.getElementById('addLocation').innerHTML = '<option value="">⚠️ Could not load racks: ' + err.message + '</option>';
  });
}

function refreshLocationOptions() {
  const isRacked = document.getElementById('addStorageType').value === 'racked';
  document.getElementById('addLocationLabel').textContent = isRacked ? 'Rack Code' : 'Non-Rack Zone Code';
  const filtered = allRacks.filter(r => isRacked ? r.toUpperCase().startsWith('RACK-') : !r.toUpperCase().startsWith('RACK-'));
  const sel = document.getElementById('addLocation');
  sel.innerHTML = filtered.length
    ? filtered.map(r => '<option value="' + r + '">' + r + '</option>').join('')
    : '<option value="">No ' + (isRacked ? 'racks' : 'zones') + ' found - add one in the Racks sheet first</option>';
}

function toggleBarcodeModeUI() {
  const existing = document.getElementById('addBarcodeMode').value === 'existing';
  document.getElementById('addExistingBarcodeBlock').style.display = existing ? 'block' : 'none';
}

function submitAddItem() {
  const payload = {
    itemName: document.getElementById('addName').value.trim(),
    category: document.getElementById('addCategory').value.trim(),
    isRacked: document.getElementById('addStorageType').value === 'racked',
    locationCode: document.getElementById('addLocation').value,
    unit: document.getElementById('addUnit').value.trim() || 'Pcs',
    reorder: document.getElementById('addReorder').value || 0,
    barcodeMode: document.getElementById('addBarcodeMode').value,
    existingBarcode: document.getElementById('addExistingBarcode').value.trim()
  };

  const msgEl = document.getElementById('addMsg');
  function showAddMsg(cls, text) {
    msgEl.className = 'msg ' + cls;
    msgEl.textContent = text;
    msgEl.style.display = 'block';
  }

  if (!payload.itemName) { showAddMsg('err', '⚠️ Item name is required.'); return; }
  if (!payload.locationCode) { showAddMsg('err', '⚠️ Please choose a rack / zone code.'); return; }
  if (payload.barcodeMode === 'existing' && !payload.existingBarcode) {
    showAddMsg('err', '⚠️ Scan or type the existing barcode.'); return;
  }

  const btn = document.getElementById('addSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Creating…';
  callApi('addItem', { payload: payload }).then(res => {
    btn.disabled = false;
    btn.textContent = '✅ Create Item';
    if (res.success) {
      showAddMsg('ok', '✅ ' + res.message);
      document.getElementById('addName').value = '';
      document.getElementById('addCategory').value = '';
      document.getElementById('addExistingBarcode').value = '';
      document.getElementById('addReorder').value = 0;
    } else {
      showAddMsg('err', '❌ ' + res.message);
    }
  }).catch(err => {
    btn.disabled = false;
    btn.textContent = '✅ Create Item';
    showAddMsg('err', '❌ ' + err.message);
  });
}

// ---------------- MANAGE BRANCHES ----------------
function loadBranchListForManage() {
  const table = document.getElementById('branchListTable');
  table.innerHTML = '<tbody><tr><td>Loading…</td></tr></tbody>';
  callApi('getSheetData', { sheetName: 'Branches' }).then(res => {
    const headers = res.headers || [];
    const rows = res.rows || [];
    const nameIdx = headers.findIndex(h => String(h).toLowerCase().indexOf('name') !== -1);
    if (!rows.length) {
      table.innerHTML = '<tbody><tr><td class="empty-msg">No branches yet.</td></tr></tbody>';
      return;
    }
    const body = rows.map(r => {
      const name = nameIdx !== -1 ? r[nameIdx] : r[0];
      return '<tr><td>' + r.join('</td><td>') + '</td><td><button style="background:none;border:none;color:var(--warn);font-weight:700;cursor:pointer;" onclick="deleteBranchFromAdmin(\'' +
        String(name).replace(/'/g, "\\'") + '\')">🗑️ Delete</button></td></tr>';
    }).join('');
    table.innerHTML = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '<th>Action</th></tr></thead><tbody>' + body + '</tbody>';
  }).catch(err => {
    table.innerHTML = '<tbody><tr><td>❌ ' + err.message + '</td></tr></tbody>';
  });
}

function addBranchFromAdmin() {
  const nameInput = document.getElementById('newBranchName');
  const name = nameInput.value.trim();
  const msgEl = document.getElementById('branchMsg');
  function showBranchMsg(cls, text) {
    msgEl.className = 'msg ' + cls;
    msgEl.textContent = text;
    msgEl.style.display = 'block';
  }
  if (!name) { showBranchMsg('err', '⚠️ Enter a branch name.'); return; }

  callApi('addBranch', { branchName: name }).then(res => {
    if (res.success) {
      showBranchMsg('ok', '✅ ' + res.message);
      nameInput.value = '';
      loadBranchListForManage();
    } else {
      showBranchMsg('err', '❌ ' + res.message);
    }
  }).catch(err => showBranchMsg('err', '❌ ' + err.message));
}

function deleteBranchFromAdmin(name) {
  if (!confirm('Delete branch "' + name + '" permanently? This cannot be undone.')) return;
  callApi('deleteBranch', { branchName: name }).then(res => {
    if (!res.success) alert('❌ ' + res.message);
    loadBranchListForManage();
  }).catch(err => alert('❌ ' + err.message));
}

// ---------------- DASHBOARD (Godown vs Branch-wise stock) ----------------
function loadLocationStock() {
  document.getElementById('locationStatsRow').innerHTML = '<div class="stat"><div class="num">…</div><div class="lbl">Loading</div></div>';
  document.getElementById('locationDetailWrap').innerHTML = '';
  callApi('getLocationStock').then(renderLocationStock).catch(err => {
    document.getElementById('locationStatsRow').innerHTML =
      '<div class="stat"><div class="num">❌</div><div class="lbl">' + err.message + '</div></div>';
  });
}

function renderLocationStock(data) {
  const godown = data.godown || { totalUnits: 0, items: [] };
  const branches = data.branches || [];

  const statsHtml = ['<div class="stat"><div class="num">' + godown.totalUnits + '</div><div class="lbl">🏭 Savali Godown (units in stock)</div></div>']
    .concat(branches.map(b => '<div class="stat"><div class="num">' + b.totalUnits + '</div><div class="lbl">🏬 ' + b.name + ' (units received)</div></div>'))
    .join('');
  document.getElementById('locationStatsRow').innerHTML = statsHtml;

  let detailHtml = '<div class="section-title">🏭 Savali Godown — Item-wise Current Stock (Stock In − Stock Out to all branches)</div>' +
    buildLocationTable(['SKU', 'Item', 'Rack/Location', 'Current Stock'], godown.items.map(it => [it.sku, it.name, it.location, it.stock]));

  branches.forEach(b => {
    detailHtml += '<div class="section-title">🏬 ' + b.name + ' — Item-wise Stock Received from Godown</div>' +
      buildLocationTable(['SKU', 'Item', 'Qty Received'], b.items.map(it => [it.sku, it.name, it.qty]));
  });

  document.getElementById('locationDetailWrap').innerHTML = detailHtml;
}

function buildLocationTable(headers, rows) {
  const thead = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead>';
  const tbody = rows.length
    ? '<tbody>' + rows.map(r => '<tr>' + r.map(v => '<td>' + (v === null || v === undefined ? '' : v) + '</td>').join('') + '</tr>').join('') + '</tbody>'
    : '<tbody><tr><td colspan="' + headers.length + '" class="empty-msg">No stock recorded yet.</td></tr></tbody>';
  return '<div class="location-table-wrap"><table>' + thead + tbody + '</table></div>';
}
</script>
</body>
</html>
