<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raghuvir IMS - Admin Dashboard</title>
<style>
  :root{
    --maroon:#6d2932; --maroon-dark:#4e1e25; --gold:#c98a2c; --bg:#faf6f1;
    --ok:#2f8f4e; --warn:#c0392b; --card:#ffffff; --line:#e7ddd2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#2a2a2a;overflow-x:hidden;}
  header{background:var(--maroon);color:#fff;padding:12px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;}
  header p{margin:2px 0 0;font-size:11px;opacity:.85;}
  .brand-logo{height:68px;width:68px;object-fit:contain;border-radius:12px;background:#fff;padding:4px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  label{font-size:12px;font-weight:600;color:#6b5c50;display:block;margin-bottom:5px;}
  input[type=text], input[type=number], input[type=date], select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:10px;background:#fff;}
  input[type=date]{font-size:15px;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:10px;display:none;}
  .msg.ok{background:#e7f6ea;color:var(--ok);display:block;}
  .msg.err{background:#fdecea;color:var(--warn);display:block;}
  input:focus, select:focus{outline:none;border-color:var(--gold);}
  button{padding:10px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-secondary{background:#efe6db;color:var(--maroon-dark);}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0;max-width:1100px;margin:0 auto;}
  .tab{padding:9px 14px;font-size:13px;border-radius:8px 8px 0 0;color:var(--maroon-dark);cursor:pointer;background:#efe1d3;border:1px solid var(--line);border-bottom:none;}
  .tab.active{background:var(--card);font-weight:700;color:var(--maroon);}

  .toolbar{max-width:1100px;margin:0 auto;padding:0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .toolbar input[type=text]{flex:1;min-width:180px;margin-bottom:0;}
  .toolbar input[type=date]{flex:0 0 auto;width:160px;margin-bottom:0;}
  .count-badge{font-size:12px;color:#777;white-space:nowrap;}

  .table-wrap{max-width:1100px;margin:10px auto 24px;padding:0 14px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:#f1e6d8;color:var(--maroon-dark);font-weight:700;position:sticky;top:0;}
  tr:hover td{background:#fbf6ee;}
  .lowstock{color:var(--warn);font-weight:700;}
  .empty-msg{padding:20px;text-align:center;color:#999;font-size:13px;}

  tr.row-red{background:#fbe1df;} tr.row-red td{color:#7a1f19;font-weight:600;}
  tr.row-orange{background:#fce6cf;} tr.row-orange td{color:#7a4a12;}
  tr.row-lightbrown{background:#f1e3cf;} tr.row-lightbrown td{color:#5c4726;}
  tr.row-green{background:#e2f4e6;} tr.row-green td{color:#1f5c34;}

  .stats{display:flex;gap:10px;flex-wrap:wrap;max-width:1100px;margin:10px auto;padding:0 14px;}
  .stat{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .stat .num{font-size:22px;font-weight:700;color:var(--maroon);}
  .stat .lbl{font-size:11px;color:#777;margin-top:2px;}
  .section-title{font-size:13px;font-weight:700;color:var(--maroon-dark);margin:16px auto 8px;max-width:1100px;padding:0 14px;}
  .location-table-wrap{max-width:1100px;margin:0 auto 10px;padding:0 14px;overflow-x:auto;}

  .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,15,15,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;}
  .overlay-card{background:#fff;border-radius:12px;padding:16px;max-width:720px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .overlay-card table{font-size:12px;}
  .stockout-link{background:none;border:none;color:var(--maroon);font-weight:700;text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0;}
</style>
</head>
<body>

<header>
  <h1><img src="https://drive.google.com/thumbnail?id=18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO&sz=w200" alt="Logo" class="brand-logo" onerror="this.style.display='none'"> RAGHUVIR SWEETS &amp; BAKERS</h1>
  <p>Admin Dashboard — All Records</p>
</header>

<div class="msg" id="testMsg" style="margin:14px;"></div>

<div class="card" id="urlSetupCard" style="display:none;margin:14px;">
  <label>⚠️ Web App URL not set - paste it here to continue</label>
  <input type="text" id="urlSetupInput" placeholder="https://script.google.com/macros/s/XXXXX/exec">
  <button class="btn-primary" onclick="saveUrlFallback()">💾 Save &amp; Continue</button>
  <p style="font-size:11px;color:#888;margin-top:8px;">
    This is saved only in this browser/device. To make it permanent, edit the API_URL line in the code.
  </p>
  <p id="debugUrlLine" style="font-size:11px;color:var(--warn);margin-top:6px;font-family:monospace;word-break:break-all;"></p>
</div>

<div class="tabs" id="tabBar"></div>

<div class="toolbar" id="toolbarView">
  <input type="text" id="searchBox" placeholder="🔍 Search this table…" oninput="applyFilter()">
  <input type="date" id="dateFilterStart" style="display:none;" onchange="loadCurrentTable()" title="Start Date">
  <span id="dateFilterSep" style="display:none;font-size:12px;color:#777;">to</span>
  <input type="date" id="dateFilterEnd" style="display:none;" onchange="loadCurrentTable()" title="End Date">
  <button class="btn-secondary" id="dateFilterClearBtn" style="display:none;" onclick="clearDateFilter()">✕ Clear Dates</button>
  <select id="extraFilterSelect" style="display:none;flex:0 0 auto;min-width:160px;" onchange="applyFilter()"><option value="">All</option></select>
  <button class="btn-primary" id="tableActionBtn" style="display:none;" onclick="handleTableActionClick()"></button>
  <button class="btn-secondary" id="bulkAssignBtn" style="display:none;" onclick="handleBulkAssignClick()">🧩 Bulk Assign SKUs</button>
  <button class="btn-secondary" onclick="loadCurrentTable()">🔄 Refresh</button>
  <span class="count-badge" id="countBadge"></span>
</div>

<div class="legend" id="stockHealthLegend" style="display:none;max-width:1100px;margin:0 auto 8px;padding:0 14px;gap:12px;flex-wrap:wrap;font-size:11px;color:#555;">
  <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:11px;height:11px;border-radius:3px;display:inline-block;background:#c0392b;"></span> Red — at/below reorder</span>
  <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:11px;height:11px;border-radius:3px;display:inline-block;background:#d97b1f;"></span> Orange — 100–130% of reorder</span>
  <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:11px;height:11px;border-radius:3px;display:inline-block;background:#8a6a3f;"></span> Light Brown — 130–150%</span>
  <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:11px;height:11px;border-radius:3px;display:inline-block;background:#2f8f4e;"></span> Green — above 150%</span>
</div>

<div class="table-wrap" id="tableView">
  <table id="dataTable">
    <thead><tr><th>Loading…</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div id="dashboardView" style="display:none;">
  <div class="card" style="max-width:1100px;margin:14px auto;">
    <label>📍 Select Location</label>
    <select id="locationSelect" onchange="renderSelectedLocation()"><option value="">Loading…</option></select>
  </div>
  <div class="stats" id="locationStatsRow"></div>

  <div class="card" id="logStockOutCard" style="display:none;max-width:1100px;margin:10px auto;">
    <label>➖ Log Stock-Out for this Branch (sale / dispatch / wastage)</label>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <input type="text" id="stockOutSku" placeholder="SKU Code (e.g. RACK-001-A-001)" style="flex:2;min-width:160px;">
      <input type="number" id="stockOutQty" placeholder="Qty" style="flex:1;min-width:80px;">
    </div>
    <input type="text" id="stockOutRemarks" placeholder="Reason / remarks (optional)">
    <div class="msg" id="stockOutMsg"></div>
    <button class="btn-primary" onclick="submitBranchStockOut()" style="width:100%;">✅ Log Stock-Out</button>
  </div>

  <div id="locationDetailWrap"></div>
</div>

<!-- ============================= TOTAL STOCK REPORT TAB ============================= -->
<div id="stockOutView" style="display:none;">
  <div class="card" style="max-width:1100px;margin:14px auto;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <div style="flex:1;min-width:150px;">
        <label>📦 Category Filter</label>
        <select id="stockOutCategory"><option value="All">Loading…</option></select>
      </div>
      <div style="flex:1;min-width:150px;">
        <label>🗄️ Rack / Location Filter</label>
        <select id="stockOutRack"><option value="All">Loading…</option></select>
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <div style="flex:1;min-width:150px;">
        <label>Start Date</label>
        <input type="date" id="stockOutStartDate">
      </div>
      <div style="flex:1;min-width:150px;">
        <label>End Date</label>
        <input type="date" id="stockOutEndDate">
      </div>
    </div>
    <button class="btn-primary" onclick="loadStockOutSummary()" style="width:100%;">🔍 Show Report</button>
  </div>
  <div class="table-wrap" id="stockOutTableWrap"></div>
</div>

<div class="overlay" id="drilldownOverlay" onclick="closeDrilldownOnOverlay(event)">
  <div class="overlay-card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h3 id="drilldownTitle" style="margin:0;font-size:14px;color:var(--maroon-dark);"></h3>
      <button class="btn-secondary" onclick="closeDrilldown()">✕ Close</button>
    </div>
    <div id="drilldownTableWrap" style="margin-top:10px;overflow-x:auto;"></div>
  </div>
</div>

<div class="card" id="addItemView" style="display:none;max-width:1100px;margin:10px auto 24px;">
  <label>Item Name</label>
  <input type="text" id="addName" placeholder="e.g. Kaju Katli Box - 500g">
  <label>Category</label>
  <input type="text" id="addCategory" placeholder="e.g. Packing Box, Ribbon">
  <label>Storage Type</label>
  <select id="addStorageType">
    <option value="racked">Racked (stored on a rack)</option>
    <option value="nonracked">Non-Racked (loose storage zone)</option>
  </select>
  <label id="addLocationLabel">Rack Code</label>
  <select id="addLocation" onchange="handleLocationSelectChange()"><option value="">Loading…</option></select>
  <input type="text" id="addLocationManual" placeholder="Type rack/zone code" style="display:none;">
  <label>Unit</label>
  <input type="text" id="addUnit" value="Pcs">
  <label>Reorder Level</label>
  <input type="number" id="addReorder" value="0">
  <label>Rate (₹ per unit)</label>
  <input type="number" id="addRate" step="0.01">
  <label>Qty per Kg</label>
  <input type="number" id="addQtyPerKg" step="0.01">
  <label>Barcode</label>
  <select id="addBarcodeMode">
    <option value="generate">Generate new QR sticker</option>
    <option value="existing">Use existing vendor barcode</option>
  </select>
  <div id="addExistingBarcodeBlock" style="display:none;">
    <label>Existing barcode value</label>
    <input type="text" id="addExistingBarcode">
  </div>
  <div class="msg" id="addMsg"></div>
  <button class="btn-primary" id="addSubmitBtn" onclick="submitAddItem()" style="width:100%;">✅ Create Item</button>
</div>

<div class="card" id="addBranchView" style="display:none;max-width:1100px;margin:10px auto 24px;">
  <label>Add New Branch</label>
  <div style="display:flex;gap:10px;">
    <input type="text" id="newBranchName" placeholder="e.g. New Outlet Name" style="flex:1;">
    <button class="btn-primary" onclick="addBranchFromAdmin()" style="flex:0 0 auto;">➕ Add Branch</button>
  </div>
  <div class="msg" id="branchMsg"></div>
</div>

<script>
const TABLES = [
  { key: 'Item_Master',   label: '📦 Item Master' },
  { key: 'Stock_Ledger',  label: '📊 Stock Ledger' },
  { key: 'Inward_Entry',  label: '📥 Inward Log' },
  { key: 'Outward_Entry', label: '📤 Outward Log' },
  { key: 'Branch_Ledger', label: '🏬 Branch Ledger' },
  { key: 'Branch_Outward_Entry', label: '➖ Branch Stock-Out' },
  { key: 'Branches',      label: '🏬 Branches' },
  { key: 'Racks',         label: '🗄️ Racks' }
];
const DASHBOARD_KEY = 'Dashboard';
const TOTAL_STOCKOUT_KEY = 'TotalStockReport'; 

const DATE_FILTER_TABLES = ['Inward_Entry', 'Outward_Entry'];
const API_URL = "https://script.google.com/macros/s/AKfycbzRyb3a1UBD2HfiA3_OYPEVghv3Bu4yMkPMfqncCv6ScWFsVh77lxwp7Z2_WQiVaGT_/exec";
const URL_PLACEHOLDER = 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE';

function getEffectiveApiUrl() {
  if (API_URL.indexOf(URL_PLACEHOLDER) === -1 && API_URL.trim() !== '') return API_URL.trim();
  return (localStorage.getItem('ims_api_url_fallback') || '').trim();
}

function saveUrlFallback() {
  const url = document.getElementById('urlSetupInput').value.trim();
  if (!url) { alert('Please paste Web App URL.'); return; }
  localStorage.setItem('ims_api_url_fallback', url);
  document.getElementById('urlSetupCard').style.display = 'none';
  loadCurrentTable();
}

let currentTableKey = DASHBOARD_KEY;
let currentHeaders = [];
let currentRows = [];

function rawCallApi(action, data) {
  const url = getEffectiveApiUrl();
  if (!url) {
    document.getElementById('urlSetupCard').style.display = 'block';
    return Promise.reject(new Error('Web App URL not set.'));
  }
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, data || {}))
  }).then(r => r.text()).then(text => {
    let res;
    try { res = JSON.parse(text); } 
    catch (e) { throw new Error('Invalid JSON response.'); }
    if (res && res.error) throw new Error(res.error);
    return res;
  });
}

function callApi(action, data, attempt) {
  attempt = attempt || 1;
  return rawCallApi(action, data).catch(err => {
    if (attempt < 2 && RETRYABLE_ACTIONS.indexOf(action) !== -1) {
      return new Promise(resolve => setTimeout(resolve, 900)).then(() => callApi(action, data, attempt + 1));
    }
    throw err;
  });
}
const RETRYABLE_ACTIONS = ['ping', 'getBranches', 'getRacks', 'lookupItem', 'searchItems',
  'getSheetData', 'getStockHealth', 'getLocationStock', 'getEntriesWithPhotos', 'getAvailableTables',
  'getDashboard', 'getCategories', 'getReportFilters', 'getStockOutSummary', 'getStockOutDrilldown'];

function buildTabs() {
  const bar = document.getElementById('tabBar');
  const allTabs = [
    { key: DASHBOARD_KEY, label: '📊 Dashboard' },
    { key: TOTAL_STOCKOUT_KEY, label: '📈 Total Stock Report' }
  ].concat(TABLES);
  bar.innerHTML = allTabs.map(t =>
    '<div class="tab' + (t.key === currentTableKey ? ' active' : '') + '" data-key="' + t.key + '">' + t.label + '</div>'
  ).join('');
  bar.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentTableKey = tab.dataset.key;
      document.getElementById('searchBox').value = '';
      buildTabs();
      if (currentTableKey === DASHBOARD_KEY) {
        showDashboardView();
      } else if (currentTableKey === TOTAL_STOCKOUT_KEY) {
        showStockOutView();
      } else {
        showTableView();
        loadCurrentTable();
      }
    });
  });
}

const TABLE_ACTION_CONFIG = {
  'Item_Master': { label: '➕ Add Item', formId: 'addItemView', onShow: 'loadRacksForAddItem' },
  'Branches':    { label: '➕ Add Branch', formId: 'addBranchView' }
};
let formOpenForTab = false;

function setupTableActionButton() {
  const btn = document.getElementById('tableActionBtn');
  const config = TABLE_ACTION_CONFIG[currentTableKey];
  formOpenForTab = false;
  if (!config) {
    btn.style.display = 'none';
  } else {
    btn.style.display = 'inline-block';
    btn.textContent = config.label;
  }
  document.getElementById('bulkAssignBtn').style.display = (currentTableKey === 'Item_Master') ? 'inline-block' : 'none';
}

function handleBulkAssignClick() {
  const defaultLoc = prompt('Assign SKUs to items missing codes. Enter default Rack Code if unassigned:');
  if (defaultLoc === null) return;
  const btn = document.getElementById('bulkAssignBtn');
  btn.disabled = true;
  callApi('bulkAssignSkus', { defaultLocationCode: defaultLoc.trim() }).then(res => {
    btn.disabled = false;
    alert('Assigned: ' + res.assigned);
    loadCurrentTable();
  }).catch(err => { btn.disabled = false; alert(err.message); });
}

function handleTableActionClick() {
  const config = TABLE_ACTION_CONFIG[currentTableKey];
  if (!config) return;
  const btn = document.getElementById('tableActionBtn');
  const form = document.getElementById(config.formId);
  formOpenForTab = !formOpenForTab;

  if (formOpenForTab) {
    document.getElementById('tableView').style.display = 'none';
    form.style.display = 'block';
    btn.textContent = '📋 Back to List';
    if (config.onShow) window[config.onShow]();
  } else {
    form.style.display = 'none';
    document.getElementById('tableView').style.display = 'block';
    btn.textContent = config.label;
    loadCurrentTable();
  }
}

function hideAllViews() {
  document.getElementById('toolbarView').style.display = 'none';
  document.getElementById('tableView').style.display = 'none';
  document.getElementById('addItemView').style.display = 'none';
  document.getElementById('addBranchView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('stockOutView').style.display = 'none';
}

function showTableView() {
  hideAllViews();
  document.getElementById('toolbarView').style.display = 'flex';
  document.getElementById('tableView').style.display = 'block';
  document.getElementById('searchBox').style.display = '';
  document.getElementById('stockHealthLegend').style.display = (currentTableKey === 'Stock_Ledger') ? 'flex' : 'none';

  const showDateFilter = DATE_FILTER_TABLES.indexOf(currentTableKey) !== -1;
  document.getElementById('dateFilterStart').style.display = showDateFilter ? 'inline-block' : 'none';
  document.getElementById('dateFilterEnd').style.display = showDateFilter ? 'inline-block' : 'none';
  document.getElementById('dateFilterSep').style.display = showDateFilter ? 'inline' : 'none';
  document.getElementById('dateFilterClearBtn').style.display = showDateFilter ? 'inline-block' : 'none';
  setupTableActionButton();
}

function showDashboardView() {
  hideAllViews();
  document.getElementById('dashboardView').style.display = 'block';
  loadLocationStock();
}

function clearDateFilter() {
  document.getElementById('dateFilterStart').value = '';
  document.getElementById('dateFilterEnd').value = '';
  loadCurrentTable();
}

let currentStockHealthMap = {};

function loadCurrentTable() {
  document.getElementById('dataTable').innerHTML = '<thead><tr><th>Loading…</th></tr></thead><tbody></tbody>';
  const params = { sheetName: currentTableKey };
  if (DATE_FILTER_TABLES.indexOf(currentTableKey) !== -1) {
    params.startDate = document.getElementById('dateFilterStart').value || '';
    params.endDate = document.getElementById('dateFilterEnd').value || '';
  }

  callApi('getSheetData', params).then(res => {
    currentHeaders = res.headers || [];
    currentRows = res.rows || [];
    if (currentTableKey === 'Stock_Ledger') {
      return callApi('getStockHealth').then(health => {
        currentStockHealthMap = {};
        (health || []).forEach(it => { currentStockHealthMap[String(it.sku).trim().toUpperCase()] = it.band; });
      });
    }
  }).then(() => {
    renderTable(currentRows);
  }).catch(err => {
    document.getElementById('dataTable').innerHTML = '<thead><tr><th>Error</th></tr></thead><tbody><tr><td>' + err.message + '</td></tr></tbody>';
  });
}

function formatCellValue(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'string' && v.indexOf('<') !== -1) return v;
  const n = Number(v);
  if (isNaN(n)) return v;
  if (Number.isInteger(n)) return n;
  return n.toFixed(2);
}

function renderTable(rows) {
  const isItemMaster = currentTableKey === 'Item_Master';
  const isBranches = currentTableKey === 'Branches';
  const isStockLedger = currentTableKey === 'Stock_Ledger';
  const skuIdx = isItemMaster ? currentHeaders.findIndex(h => String(h).toLowerCase().indexOf('sku') !== -1) : -1;
  const branchNameIdx = isBranches ? currentHeaders.findIndex(h => String(h).toLowerCase().indexOf('name') !== -1) : -1;
  const hasAction = (isItemMaster && skuIdx !== -1) || (isBranches && branchNameIdx !== -1);
  const ledgerSkuIdx = isStockLedger ? currentHeaders.findIndex(h => String(h).toLowerCase().indexOf('sku') !== -1) : -1;

  const thead = '<thead><tr>' + currentHeaders.map(h => '<th>' + h + '</th>').join('') + (hasAction ? '<th>Action</th>' : '') + '</tr></thead>';
  let tbody;
  if (!rows.length) {
    tbody = '<tbody><tr><td colspan="' + Math.max(currentHeaders.length + (hasAction ? 1 : 0), 1) + '" class="empty-msg">No records yet.</td></tr></tbody>';
  } else {
    tbody = '<tbody>' + rows.map(r => {
      const cells = r.map((c, i) => '<td>' + formatCellValue(c) + '</td>').join('');
      let actionCell = '';
      if (isItemMaster && skuIdx !== -1) {
        actionCell = '<td><button style="color:var(--warn);background:none;border:none;cursor:pointer;" onclick="deleteItemRow(\'' + String(r[skuIdx]).replace(/'/g, "\\'") + '\')">🗑️ Delete</button></td>';
      } else if (isBranches && branchNameIdx !== -1) {
        actionCell = '<td><button style="color:var(--warn);background:none;border:none;cursor:pointer;" onclick="deleteBranchFromAdmin(\'' + String(r[branchNameIdx]).replace(/'/g, "\\'") + '\')">🗑️ Delete</button></td>';
      }
      let rowClass = '';
      if (isStockLedger && ledgerSkuIdx !== -1) {
        const band = currentStockHealthMap[String(r[ledgerSkuIdx]).trim().toUpperCase()];
        if (band) rowClass = ' class="row-' + band + '"';
      }
      return '<tr' + rowClass + '>' + cells + actionCell + '</tr>';
    }).join('') + '</tbody>';
  }
  document.getElementById('dataTable').innerHTML = thead + tbody;
}

function applyFilter() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let filtered = currentRows;
  if (q) {
    filtered = filtered.filter(r => r.some(c => String(c || '').toLowerCase().indexOf(q) !== -1));
  }
  renderTable(filtered);
}

function deleteItemRow(sku) {
  if (!confirm('Delete item "' + sku + '"?')) return;
  callApi('deleteItem', { sku: sku }).then(res => { loadCurrentTable(); });
}

window.onload = function() {
  buildTabs();
  if (!getEffectiveApiUrl()) {
    document.getElementById('urlSetupCard').style.display = 'block';
  } else {
    showDashboardView();
  }
};

let locationStockData = null;
const GODOWN_OPTION_VALUE = '__GODOWN__';

function loadLocationStock(preserveSelection) {
  const sel = document.getElementById('locationSelect');
  const keepValue = preserveSelection ? sel.value : null;
  sel.innerHTML = '<option value="">Loading…</option>';

  callApi('getLocationStock').then(data => {
    locationStockData = data;
    const branches = data.branches || [];
    sel.innerHTML = '<option value="' + GODOWN_OPTION_VALUE + '">🏭 Savali Godown</option>' +
      branches.map(b => '<option value="' + b.name + '">🏬 ' + b.name + '</option>').join('');
    sel.value = (keepValue && Array.from(sel.options).some(o => o.value === keepValue)) ? keepValue : GODOWN_OPTION_VALUE;
    renderSelectedLocation();
  });
}

function renderSelectedLocation() {
  if (!locationStockData) return;
  const sel = document.getElementById('locationSelect');
  const isGodown = sel.value === GODOWN_OPTION_VALUE;
  const stockOutCard = document.getElementById('logStockOutCard');

  if (isGodown) {
    stockOutCard.style.display = 'none';
    const godown = locationStockData.godown || { totalUnits: 0, items: [] };
    document.getElementById('locationStatsRow').innerHTML = '<div class="stat"><div class="num">' + formatCellValue(godown.totalUnits) + '</div><div class="lbl">Godown Units</div></div>';
    document.getElementById('locationDetailWrap').innerHTML = buildLocationTable(['SKU', 'Item', 'Rack/Location', 'Current Stock', 'Reorder Level'], godown.items.map(it => [it.sku, it.name, it.location, it.stock, it.reorder]), godown.items.map(it => it.band));
  } else {
    stockOutCard.style.display = 'block';
    const branch = (locationStockData.branches || []).find(b => b.name === sel.value) || { name: sel.value, totalUnits: 0, items: [] };
    document.getElementById('locationStatsRow').innerHTML = '<div class="stat"><div class="num">' + formatCellValue(branch.totalUnits) + '</div><div class="lbl">Net Branch Stock</div></div>';
    document.getElementById('locationDetailWrap').innerHTML = buildLocationTable(['SKU', 'Item', 'Received', 'Stock-Out', 'Net Stock'], branch.items.map(it => [it.sku, it.name, it.received, it.stockOut, it.net]));
  }
}

function buildLocationTable(headers, rows, rowBands) {
  const thead = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead>';
  const tbody = rows.length ? '<tbody>' + rows.map((r, i) => {
    const rowClass = rowBands && rowBands[i] ? ' class="row-' + rowBands[i] + '"' : '';
    return '<tr' + rowClass + '>' + r.map(v => '<td>' + formatCellValue(v) + '</td>').join('') + '</tr>';
  }).join('') + '</tbody>' : '<tbody><tr><td colspan="' + headers.length + '" class="empty-msg">No stock records.</td></tr></tbody>';
  return '<div class="location-table-wrap"><table>' + thead + tbody + '</table></div>';
}

// ============================= TOTAL STOCK REPORT VIEW ===================
let reportFiltersLoaded = false;
let currentStockOutRange = { start: '', end: '' };

function showStockOutView() {
  hideAllViews();
  document.getElementById('stockOutView').style.display = 'block';
  if (!reportFiltersLoaded) {
    loadStockOutReportFilters();
  }
}

function loadStockOutReportFilters() {
  const catSel = document.getElementById('stockOutCategory');
  const rackSel = document.getElementById('stockOutRack');

  callApi('getReportFilters').then(filters => {
    reportFiltersLoaded = true;
    catSel.innerHTML = '<option value="All">All Categories</option>' +
      (filters.categories || []).map(c => '<option value="' + c + '">' + c + '</option>').join('');
    rackSel.innerHTML = '<option value="All">All Racks / Locations</option>' +
      (filters.racks || []).map(r => '<option value="' + r + '">' + r + '</option>').join('');
  }).catch(err => {
    catSel.innerHTML = '<option value="All">All Categories</option>';
    rackSel.innerHTML = '<option value="All">All Racks</option>';
  });
}

function loadStockOutSummary() {
  const category = document.getElementById('stockOutCategory').value || 'All';
  const rack = document.getElementById('stockOutRack').value || 'All';
  const startDate = document.getElementById('stockOutStartDate').value;
  const endDate = document.getElementById('stockOutEndDate').value;
  currentStockOutRange = { start: startDate, end: endDate };

  document.getElementById('stockOutTableWrap').innerHTML = '<div class="empty-msg">Loading report data…</div>';
  callApi('getStockOutSummary', { category: category, rack: rack, startDate: startDate, endDate: endDate }).then(res => {
    renderStockOutTable(res.items || [], res.dayDiff || 1);
  }).catch(err => {
    document.getElementById('stockOutTableWrap').innerHTML = '<div class="empty-msg">⚠️ ' + err.message + '</div>';
  });
}

function renderStockOutTable(items, dayDiff) {
  const wrap = document.getElementById('stockOutTableWrap');
  if (!items.length) {
    wrap.innerHTML = '<div class="empty-msg">No records found matching selected Category/Rack/Date filters.</div>';
    return;
  }
  const rows = items.map(it =>
    '<tr>' +
      '<td>' + (it.location || '—') + '</td>' +
      '<td>' + it.sku + '</td>' +
      '<td>' + it.name + '</td>' +
      '<td>' + (it.category || '—') + '</td>' +
      '<td><button class="stockout-link" onclick="showStockOutDrilldown(\'' + String(it.sku).replace(/'/g, "\\'") + '\',\'' + String(it.name).replace(/'/g, "\\'") + '\')">' + formatCellValue(it.totalStockOut) + '</button></td>' +
      '<td>' + formatCellValue(it.qtyPerKg) + '</td>' +
      '<td>' + formatCellValue(it.avgQty) + '</td>' +
      '<td>' + formatCellValue(it.avgConsumption) + '</td>' +
    '</tr>'
  ).join('');
  wrap.innerHTML =
    '<div class="count-badge" style="padding:0 0 6px;">' + items.length + ' item(s) — Sorted by Rack Code (Duration: ' + dayDiff + ' day(s))</div>' +
    '<table><thead><tr>' +
      '<th>Rack Code</th><th>SKU</th><th>Item Name</th><th>Category</th><th>Total Stock Out</th><th>Qty / Kg</th><th>Avg Qty / Day</th><th>Avg Consumption</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function showStockOutDrilldown(sku, name) {
  document.getElementById('drilldownTitle').textContent = '📦 ' + name + ' (' + sku + ') Log Drilldown';
  document.getElementById('drilldownTableWrap').innerHTML = '<div class="empty-msg">Loading…</div>';
  document.getElementById('drilldownOverlay').style.display = 'flex';

  callApi('getStockOutDrilldown', { sku: sku, startDate: currentStockOutRange.start, endDate: currentStockOutRange.end }).then(rows => {
    if (!rows || !rows.length) {
      document.getElementById('drilldownTableWrap').innerHTML = '<div class="empty-msg">No entries in range.</div>';
      return;
    }
    const trs = rows.map(r =>
      '<tr><td>' + r.date + '</td><td>' + formatCellValue(r.qty) + '</td><td>' + (r.branch || '—') + '</td><td>' + (r.enteredBy || '—') + '</td></tr>'
    ).join('');
    document.getElementById('drilldownTableWrap').innerHTML =
      '<table><thead><tr><th>Date/Time</th><th>Qty</th><th>Branch</th><th>Entered By</th></tr></thead><tbody>' + trs + '</tbody></table>';
  });
}

function closeDrilldown() { document.getElementById('drilldownOverlay').style.display = 'none'; }
function closeDrilldownOnOverlay(e) { if (e.target && e.target.id === 'drilldownOverlay') closeDrilldown(); }
</script>
